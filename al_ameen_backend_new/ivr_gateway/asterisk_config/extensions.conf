; =========================================================================
; Al-Ameen Mission Hostel Calling System - Asterisk Dialplan
; Matches exact workflow of phone_dia.mp4 with 8-Minute Strict Talk Time Limit
; =========================================================================

[general]
static=yes
writeprotect=no

[booth-ivr]
; When student lifts handset, Yealink Hotline dials 1000
exten => 1000,1,Answer()
same => n,Wait(1)

; -------------------------------------------------------------------------
; STEP 1: Prompt student to enter Registration Number
; -------------------------------------------------------------------------
same => n(prompt_reg),Read(STUDENT_REG,ivr/enter_reg_no,6,,,10)
same => n,GotoIf($["${STUDENT_REG}" = ""]?hangup_invalid)

; FastAGI / Python / Node script queries Backend API
same => n,AGI(al_ameen_ivr_agi.py,verify_student,${STUDENT_REG})

; If student invalid, announce and retry
same => n,GotoIf($["${AGI_STATUS}" != "confirm_reg"]?hangup_invalid_reg)

; Announce "Your ID is X X X X. Press 1 to continue" (as in video)
same => n,Playback(ivr/your_id_is)
same => n,SayDigits(${STUDENT_REG})
same => n,Read(CONFIRM_DIGIT,ivr/press_1_to_continue,1,,,6)
same => n,GotoIf($["${CONFIRM_DIGIT}" != "1"]?prompt_reg)

; -------------------------------------------------------------------------
; STEP 2: Check Schedule & 8-Minute Quota
; -------------------------------------------------------------------------
same => n,AGI(al_ameen_ivr_agi.py,confirm_student,${STUDENT_ID},1)

; If not scheduled:
same => n,GotoIf($["${AGI_STATUS}" = "not_scheduled"]?hangup_not_scheduled)

; If quota exhausted (8 minutes used):
same => n,GotoIf($["${AGI_STATUS}" = "quota_exhausted"]?hangup_quota)

; If no contacts:
same => n,GotoIf($["${AGI_STATUS}" = "no_contacts"]?hangup_no_contacts)

; -------------------------------------------------------------------------
; STEP 3: Announce Guardian Menu (1 for Father, 2 for Mother...)
; -------------------------------------------------------------------------
same => n(prompt_guardian),Read(SELECTED_DIGIT,${GUARDIAN_PROMPT_FILE},1,,,8)
same => n,GotoIf($["${SELECTED_DIGIT}" = ""]?prompt_guardian)

; -------------------------------------------------------------------------
; STEP 4: Initiate Outbound Call with Hard Talk-Time Limit
; -------------------------------------------------------------------------
same => n,AGI(al_ameen_ivr_agi.py,connect_guardian,${STUDENT_ID},${SELECTED_DIGIT})
same => n,GotoIf($["${TARGET_MOBILE}" = ""]?prompt_guardian)

same => n,Playback(ivr/guardian_selected)
same => n,Playback(ivr/connecting_call)

; Asterisk L(x:y:z) option:
; x = Total allowed talk time in milliseconds (e.g. 480000 ms = 8 minutes)
; y = Warning announcement at 60000 ms (1 minute) before call end
; z = Warning repeat interval (30000 ms)
same => n,Dial(SIP/gsm_trunk/${TARGET_MOBILE},40,L(${TIME_LIMIT_MS}:60000:30000))

; -------------------------------------------------------------------------
; STEP 5: Call Completed -> Update hostel_call_logs in Database
; -------------------------------------------------------------------------
same => n,AGI(al_ameen_ivr_agi.py,end_call,${CALL_ID},${CDR(billsec)},${DIALSTATUS})
same => n,Hangup()

; Error / Rejection Handlers
same => n(hangup_not_scheduled),Playback(ivr/not_scheduled_today)
same => n,Hangup()

same => n(hangup_quota),Playback(ivr/quota_exhausted_8min)
same => n,Hangup()

same => n(hangup_invalid_reg),Playback(ivr/invalid_reg_number)
same => n,Hangup()

same => n(hangup_invalid),Playback(ivr/invalid_input)
same => n,Hangup()

same => n(hangup_no_contacts),Playback(ivr/no_guardian_contacts)
same => n,Hangup()

; =========================================================================
; BLOCK ALL INCOMING CALLS (Outgoing-Only Student Booth Policy)
; Any incoming call from VG204O FXO / FCT / GSM Gateway is immediately
; rejected with Cause 21 (Call Rejected / SIP 403) without ringing booths.
; =========================================================================
[incoming-gsm]
exten => _X.,1,NoOp(BLOCKED incoming call from ${CALLERID(all)} to ${EXTEN} - Incoming calls OFF)
same => n,Hangup(21)

exten => s,1,NoOp(BLOCKED incoming call from ${CALLERID(all)} - Incoming calls OFF)
same => n,Hangup(21)

[default]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)

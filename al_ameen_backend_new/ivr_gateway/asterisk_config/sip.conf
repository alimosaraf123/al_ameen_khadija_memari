; =========================================================================
; Al-Ameen Mission Hostel Calling System - Asterisk SIP Configuration
; =========================================================================

[general]
context=default
allowguest=no
bindport=5060
bindaddr=0.0.0.0
srvlookup=yes
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833

; -------------------------------------------------------------------------
; 1. Yealink SIP Phones (Booth 1 to Booth 4 — Outgoing Only)
; -------------------------------------------------------------------------
[101]
type=friend
host=dynamic
secret=booth123
context=booth-ivr
callerid="Student Booth 1" <101>
qualify=yes
nat=force_rport,comedia
canreinvite=no

[102]
type=friend
host=dynamic
secret=booth123
context=booth-ivr
callerid="Student Booth 2" <102>
qualify=yes
nat=force_rport,comedia
canreinvite=no

[103]
type=friend
host=dynamic
secret=booth123
context=booth-ivr
callerid="Student Booth 3" <103>
qualify=yes
nat=force_rport,comedia
canreinvite=no

[104]
type=friend
host=dynamic
secret=booth123
context=booth-ivr
callerid="Student Booth 4" <104>
qualify=yes
nat=force_rport,comedia
canreinvite=no

; -------------------------------------------------------------------------
; 2. VG204O 4-Port FXO / GSM Gateway Trunk (Incoming Calls BLOCKED via incoming-gsm)
; -------------------------------------------------------------------------
[gsm_trunk]
type=peer
host=192.168.1.200       ; IP address of your VG204O FXO / GSM Gateway
port=5060
context=incoming-gsm     ; All incoming calls are immediately rejected (Hangup 21)
disallow=all
allow=alaw
allow=ulaw
insecure=port,invite
qualify=yes
canreinvite=no
